name: sesh
description: SESH - Follow the story through Ancient Egypt.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_bloc: ^8.1.6
  http: ^1.2.2
  intl: ^0.20.3
  shared_preferences: ^2.3.2
  url_launcher: ^6.3.1
  webview_flutter: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/brand/
    - assets/placeholders/
    - assets/historical/
    - assets/map/
    - assets/icons/
